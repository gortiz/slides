<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Native Speed, Java Comfort</title>
  <link rel="stylesheet" href="template/vendor/reveal/reset.css">
  <link rel="stylesheet" href="template/vendor/reveal/reveal.css">
  <link rel="stylesheet" href="template/vendor/reveal/plugin/highlight/monokai.css">
  <link rel="stylesheet" href="template/theme.css">
  <link rel="stylesheet" href="talk.css">
</head>
<body>
  <div class="reveal"><div class="slides"></div></div>
  <script src="template/vendor/reveal/reveal.js"></script>
  <script src="template/vendor/reveal/plugin/notes/notes.js"></script>
  <script src="template/vendor/reveal/plugin/highlight/highlight.js"></script>
  <script>
    // Chapter order, footer labels and target minutes (45-minute slot). The loader prints each slide's
    // time slot at the top of its speaker notes.
    window.DECK = {
      chapters: [
        { file: "chapters/00-opening.html",     label: "Opening",     minutes: 5 },
        { file: "chapters/01-primitives.html",  label: "Primitives",  minutes: 3 },
        { file: "chapters/02-strings.html",     label: "Strings",     minutes: 6 },
        { file: "chapters/03-handles.html",     label: "Handles",     minutes: 7 },
        { file: "chapters/04-structs.html",     label: "Structs",     minutes: 7 },
        { file: "chapters/05-bindings.html",    label: "Bindings",    minutes: 3 },
        { file: "chapters/06-callbacks.html",   label: "Callbacks",   minutes: 7 },
        { file: "chapters/07-wrapping-up.html", label: "Wrapping up", minutes: 6 },
        { file: "chapters/08-closing.html",     label: "Closing",     minutes: 1 },    // + Q&A
      ],
      reveal: {
        highlight: {
          // `text` blocks (shell commands, pipelines) stay plain
          beforeHighlight: (hljs) => hljs.registerLanguage("text", () => ({ name: "text", contains: [] })),
        },
      },
    };
  </script>
  <script src="template/vendor/rough/rough.js"></script>
  <script src="template/sketch.js"></script>
  <script src="template/vendor/qrcode/qrcode.js"></script>
  <script src="template/qr.js"></script>
  <script src="template/loader.js"></script>
</body>
</html>
